services:
  postgres:
    image: postgres:16-alpine
    container_name: nids-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nids_user
      POSTGRES_PASSWORD: nids_pass
      POSTGRES_DB: nids_db
    ports:
      - "5432:5432"
    volumes:
      - nids_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  nids_pgdata:
